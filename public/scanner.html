<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <meta name="theme-color" content="#0f172a" />

    <title>Job4Me Attendance</title>

    <link rel="stylesheet" href="style.css" />
  </head>

  <body>
    <main class="app-shell">
      <!-- Header -->

      <header class="app-header">
        <div class="brand-row">
          <img
            src="/logo/job4me_transparent.png"
            alt="Job4Me Logo"
            class="site-logo"
          />

          <div class="brand-text">
            <h1>Job4Me Newcastle</h1>

            <p class="eyebrow">ATTENDANCE</p>

            <p class="subtitle">
              Enter your learner number to check in or check out.
            </p>
          </div>
        </div>

        <div class="status-pill" id="systemStatus">Ready</div>
      </header>

      <!-- Main attendance card -->

      <section class="scanner-card">
        <div class="scanner-heading">
          <h2>Welcome!</h2>

          <p>Please enter your learner number.</p>
        </div>

        <!-- Learner ID display -->

        <div class="learner-id-display" aria-label="Learner ID">
          <span class="id-prefix" id="idPrefix"> J4M_ </span>

          <span class="id-number" id="enteredDigits"> _ _ </span>
        </div>

        <!-- Number pad -->

        <div class="number-pad" id="numberPad">
          <button type="button" class="number-button" data-number="1">1</button>

          <button type="button" class="number-button" data-number="2">2</button>

          <button type="button" class="number-button" data-number="3">3</button>

          <button type="button" class="number-button" data-number="4">4</button>

          <button type="button" class="number-button" data-number="5">5</button>

          <button type="button" class="number-button" data-number="6">6</button>

          <button type="button" class="number-button" data-number="7">7</button>

          <button type="button" class="number-button" data-number="8">8</button>

          <button type="button" class="number-button" data-number="9">9</button>

          <button
            type="button"
            class="keypad-action clear-button"
            id="clearButton"
          >
            Clear
          </button>

          <button type="button" class="number-button" data-number="0">0</button>

          <button
            type="button"
            class="keypad-action backspace-button"
            id="backspaceButton"
            aria-label="Delete last number"
          >
            ⌫
          </button>
        </div>

        <!-- Submit -->

        <button id="submitButton" class="submit-button" type="button">
          Check in / out
        </button>

        <!-- Logout -->

        <button id="logoutButton" class="logout-button" type="button">
          Log out
        </button>
      </section>

      <!-- Result popup -->

      <section class="result-card hidden" id="resultCard" aria-live="polite">
        <div class="result-icon" id="resultIcon">✓</div>

        <div class="result-content">
          <h2 id="resultTitle">Attendance updated</h2>

          <p class="result-name" id="resultName"></p>

          <p class="result-detail" id="resultDetail"></p>
        </div>
      </section>
    </main>

    <script src="script.js"></script>
  </body>
</html>
