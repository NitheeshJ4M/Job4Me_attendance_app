<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Job4Me Attendance</title>

    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        font-family: Arial, sans-serif;
        background: #f4f6f8;
      }

      .login-card {
        width: min(90%, 380px);
        background: white;
        padding: 32px;
        border-radius: 18px;
        box-shadow: 0 10px 35px rgba(0, 0, 0, 0.12);
      }

      .login-logo {
        display: block;
        width: 160px;
        height: auto;
        margin: 0 auto -10px;
      }

      h1 {
        text-align: center;
        margin-top: 0;
        color: #169f4b;
      }

      .field {
        margin-bottom: 18px;
      }

      label {
        display: block;
        margin-bottom: 6px;
        font-weight: 600;
      }

      input {
        width: 100%;
        box-sizing: border-box;
        padding: 13px;
        font-size: 16px;
        border: 1px solid #ccc;
        border-radius: 8px;
      }

      button {
        width: 100%;
        padding: 14px;
        font-size: 17px;
        border: 0;
        border-radius: 8px;
        cursor: pointer;
      }

      #loginMessage {
        text-align: center;
        min-height: 24px;
        margin-top: 16px;
      }
    </style>
  </head>

  <body>
    <main class="login-card">
      <img
        src="logo/job4me_transparent.png"
        alt="Job4Me Logo"
        class="login-logo"
      />
      <h1>Job4Me Staff Login</h1>
      <form id="loginForm">
        <div class="field">
          <label for="staffId"> Staff ID </label>

          <input id="staffId" type="text" autocomplete="username" required />
        </div>

        <div class="field">
          <label for="password"> Password </label>

          <input
            id="password"
            type="password"
            autocomplete="current-password"
            required
          />
        </div>

        <button type="submit">Sign in</button>

        <p id="loginMessage"></p>
      </form>
    </main>

    <script src="login.js"></script>
  </body>
</html>
