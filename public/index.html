<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#0f172a" />

  <title>J4M Attendance Scanner</title>

  <link rel="stylesheet" href="style.css" />
  <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
</head>

<body>
  <main class="app-shell">

    <header class="app-header">
      <div>
        <p class="eyebrow">Job4Me</p>
        <h1>Attendance Scanner</h1>
        <p class="subtitle">Scan a learner QR code to check in or check out.</p>
      </div>

      <div class="status-pill" id="systemStatus">Ready</div>
    </header>

    <section class="scanner-card">
      <div class="scanner-heading">
        <h2>Scan learner QR</h2>
        <p>Hold the learner QR code inside the camera frame.</p>
      </div>

      <div id="reader" class="reader"></div>

      <div class="scanner-actions">
        <button id="startButton" class="primary-button" type="button">
          Start camera
        </button>

        <button id="stopButton" class="secondary-button" type="button" disabled>
          Stop camera
        </button>
      </div>
    </section>

    <section class="result-card hidden" id="resultCard" aria-live="polite">
      <div class="result-icon" id="resultIcon">✓</div>

      <div>
        <h2 id="resultTitle">Attendance updated</h2>
        <p class="result-name" id="resultName"></p>
        <p class="result-detail" id="resultDetail"></p>
      </div>
    </section>

    <section class="help-card">
      <h3>Ready for learner cards</h3>
      <p>
        Each learner QR should contain only the learner ID,
        for example <strong>J4M_001</strong>.
      </p>
    </section>

  </main>

  <script src="script.js"></script>
</body>
</html>
